# Development settings only; Home Assistant installs the integration from custom_components/.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# respx's pytest plugin imports httpx, which Home Assistant must alias before anything imports it.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
